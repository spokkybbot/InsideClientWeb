<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside Client — премиальный клиент</title>
<meta name="description" content="Inside Client — премиальный игровой клиент. Комфорт, доминирование, стиль.">
<script>(function(){try{var t=localStorage.getItem('ic_theme');var v=['mono','purple','emerald','crimson'];document.documentElement.setAttribute('data-theme', v.indexOf(t)!==-1?t:'mono');}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <div id="cursor-glow"></div>
  <header class="site-header" id="app-header"></header>

  <main>
    <section class="hero">
      <div class="container">
        <span class="eyebrow"><span class="dot"></span><span data-i18n="hero.eyebrow">Премиальный клиент</span></span>
        <h1 data-i18n="hero.title">О нас</h1>
        <p class="hero-text" data-i18n="hero.text">Мы предоставляем вам ахуенный клиент для комфортнейшей игры, доминирования в бою а также пиздатых впечатлений от игры.</p>
        <div class="hero-actions">
          <a href="buy.html" class="btn btn-white">
            <span id="ic-cart"></span>
            <span data-i18n="hero.buy">Купить</span>
          </a>
          <a href="https://discord.gg/tUJMPKPHxc" target="_blank" rel="noopener" class="btn btn-outline">
            <span id="ic-arrow"></span>
            <span data-i18n="hero.more">Подробнее</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div class="hero-orb" aria-hidden="true">
    <svg viewBox="0 0 200 200" width="100%" height="100%">
      <g style="transform-origin:100px 100px; animation:spin-slow 24s linear infinite;">
        <polygon points="100,20 170,58 170,142 100,180 30,142 30,58" fill="none" stroke="#9b6bff" stroke-width="1" opacity=".5"/>
        <polygon points="100,20 170,58 100,96 30,58" fill="none" stroke="#c6acff" stroke-width="1" opacity=".8"/>
        <line x1="100" y1="96" x2="100" y2="180" stroke="#c6acff" stroke-width="1" opacity=".5"/>
        <line x1="100" y1="96" x2="170" y2="58" stroke="#c6acff" stroke-width="1" opacity=".35"/>
        <line x1="100" y1="96" x2="30" y2="58" stroke="#c6acff" stroke-width="1" opacity=".35"/>
      </g>
    </svg>
  </div>

  <footer class="site-footer" id="app-footer"></footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>
    document.getElementById('ic-cart').innerHTML = ICONS.cart;
    document.getElementById('ic-arrow').innerHTML = ICONS.arrowRight;
  </script>
</body>
</html>
