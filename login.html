<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторизация — Inside Client</title>
<script>(function(){try{var t=localStorage.getItem('ic_theme');var v=['mono','purple','emerald','crimson'];document.documentElement.setAttribute('data-theme', v.indexOf(t)!==-1?t:'mono');}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <div id="cursor-glow"></div>
  <header class="site-header" id="app-header"></header>

  <main>
    <div class="auth-shell">
      <form class="auth-card" id="login-form" novalidate>
        <div class="auth-icon" id="ic-auth-icon"></div>
        <h1 data-i18n="login.title">Авторизация</h1>
        <p class="auth-sub" data-i18n="login.sub">Рады видеть тебя снова.</p>

        <div class="field">
          <label for="login-id" data-i18n="login.field.login">Логин</label>
          <div class="field-input">
            <span id="ic-user"></span>
            <input type="text" id="login-id" name="login" autocomplete="username" data-i18n-placeholder="login.field.login" placeholder="Логин">
          </div>
        </div>

        <div class="field">
          <label for="login-pass" data-i18n="login.field.password">Пароль</label>
          <div class="field-input">
            <span id="ic-lock"></span>
            <input type="password" id="login-pass" name="password" autocomplete="current-password" data-i18n-placeholder="login.field.password" placeholder="Пароль">
            <button type="button" class="toggle-visibility" id="login-toggle-pass" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="form-error" id="login-error"></div>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" id="login-remember">
            <span class="box" id="ic-check-box"></span>
            <span data-i18n="login.remember">Запомнить меня</span>
          </label>
          <a href="#" class="link-muted" id="forgot-link" data-i18n="login.forgot">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit" disabled>
          <span data-i18n="login.submit">Войти</span>
        </button>

        <p class="auth-foot">
          <span data-i18n="login.noAccount">Нет аккаунта?</span>
          <a href="register.html" data-i18n="login.toRegister">Регистрация</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="app-footer"></footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('ic-auth-icon').innerHTML = ICONS.shield;
    document.getElementById('ic-user').innerHTML = ICONS.user;
    document.getElementById('ic-lock').innerHTML = ICONS.lock;
    document.getElementById('ic-check-box').innerHTML = ICONS.check;
    document.getElementById('login-toggle-pass').innerHTML = ICONS.eye;
  </script>
</body>
</html>
