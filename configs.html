<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Облачные конфиги — Inside Client</title>
<script>(function(){try{var t=localStorage.getItem('ic_theme')||'mono';document.documentElement.setAttribute('data-theme', t);if(t==='custom'){var raw=localStorage.getItem('ic_custom_palette');if(raw){var vars=JSON.parse(raw);for(var k in vars){document.documentElement.style.setProperty(k, vars[k]);}}}}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>

  <div id="cursor-glow"></div>

        <span class="eyebrow"><span class="dot"></span><span data-i18n="dash.eyebrow">Аккаунт</span></span>

      </div>

      <div class="configs-container">
        <div class="dash-configs reveal" id="dash-configs"></div>
        <div class="field-row" style="justify-content:center; margin-top:22px;">
          <a href="dashboard.html" class="link-muted" data-i18n="activate.back">Назад в личный кабинет</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="app-footer"></footer>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>

  <script src="js/main.js"></script>
