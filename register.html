<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Inside Client</title>
<script>(function(){try{var t=localStorage.getItem('ic_theme')||'mono';document.documentElement.setAttribute('data-theme', t);if(t==='custom'){var raw=localStorage.getItem('ic_custom_palette');if(raw){var vars=JSON.parse(raw);for(var k in vars){document.documentElement.style.setProperty(k, vars[k]);}}}}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

  <div id="cursor-glow"></div>
  <header class="site-header" id="app-header"></header>

  <main>
    <div class="auth-shell">
      <form class="auth-card" id="register-form" novalidate>
        <div class="auth-icon" id="ic-auth-icon"></div>
        <h1 data-i18n="register.title">Регистрация</h1>
        <p class="auth-sub" data-i18n="register.sub">Создай аккаунт за минуту.</p>

        <div class="field">
          <label for="reg-login" data-i18n="register.field.login">Логин</label>
          <div class="field-input">
            <span id="ic-user"></span>
            <input type="text" id="reg-login" name="login" autocomplete="username" data-i18n-placeholder="register.field.login" placeholder="Логин">
          </div>
        </div>

        <div class="field">
          <label for="reg-pass" data-i18n="register.field.password">Пароль</label>
          <div class="field-input">
            <span id="ic-lock"></span>
            <input type="password" id="reg-pass" name="password" autocomplete="new-password" data-i18n-placeholder="register.field.password" placeholder="Пароль">
            <button type="button" class="toggle-visibility" id="reg-toggle-pass1" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="field">
          <label for="reg-pass2" data-i18n="register.field.confirm">Подтвердите пароль</label>
          <div class="field-input">
            <span id="ic-lock2"></span>
            <input type="password" id="reg-pass2" name="password2" autocomplete="new-password" data-i18n-placeholder="register.field.confirm" placeholder="Подтвердите пароль">
            <button type="button" class="toggle-visibility" id="reg-toggle-pass2" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="form-error" id="register-error"></div>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit">
          <span data-i18n="register.submit">Зарегистрироваться</span>
        </button>

        <p class="auth-foot">
          <span data-i18n="register.hasAccount">Уже есть аккаунт?</span>
          <a href="login.html" data-i18n="register.toLogin">Логин</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="app-footer"></footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('ic-auth-icon').innerHTML = ICONS.spark;
    document.getElementById('ic-user').innerHTML = ICONS.user;
    document.getElementById('ic-lock').innerHTML = ICONS.lock;
    document.getElementById('ic-lock2').innerHTML = ICONS.lock;
    document.getElementById('reg-toggle-pass1').innerHTML = ICONS.eye;
    document.getElementById('reg-toggle-pass2').innerHTML = ICONS.eye;
  </script>
</body>
</html>
