<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Смена пароля — Inside Client</title>
<script>(function(){try{var t=localStorage.getItem('ic_theme')||'mono';document.documentElement.setAttribute('data-theme', t);if(t==='custom'){var raw=localStorage.getItem('ic_custom_palette');if(raw){var vars=JSON.parse(raw);for(var k in vars){document.documentElement.style.setProperty(k, vars[k]);}}}}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="password">

  <div id="cursor-glow"></div>
  <header class="site-header" id="app-header"></header>

  <main>
    <div class="auth-shell">
      <form class="auth-card" id="password-form" novalidate>
        <div class="auth-icon" id="ic-auth-icon"></div>
        <h1 data-i18n="password.title">Смените пароль</h1>

        <div class="field">
          <label for="password-old" data-i18n="password.field.old">Старый пароль</label>
          <div class="field-input">
            <span id="ic-lock-old"></span>
            <input type="password" id="password-old" name="oldPassword" autocomplete="current-password" data-i18n-placeholder="password.field.old" placeholder="Старый пароль">
            <button type="button" class="toggle-visibility" id="password-toggle-old" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="field">
          <label for="password-new" data-i18n="password.field.new">Новый пароль</label>
          <div class="field-input">
            <span id="ic-lock-new"></span>
            <input type="password" id="password-new" name="newPassword" autocomplete="new-password" data-i18n-placeholder="password.field.new" placeholder="Новый пароль">
            <button type="button" class="toggle-visibility" id="password-toggle-new" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="field">
          <label for="password-new2" data-i18n="password.field.confirm">Повтор нового пароля</label>
          <div class="field-input">
            <span id="ic-lock-new2"></span>
            <input type="password" id="password-new2" name="newPassword2" autocomplete="new-password" data-i18n-placeholder="password.field.confirm" placeholder="Повтор нового пароля">
            <button type="button" class="toggle-visibility" id="password-toggle-new2" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="form-error" id="password-error"></div>

        <div class="field-row" style="justify-content:flex-end;">
          <a href="#" class="link-muted" id="password-forgot-link" data-i18n="password.forgot">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="password-submit">
          <span data-i18n="password.submit">Сохранить</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="app-footer"></footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/password.js"></script>
  <script>
    document.getElementById('ic-auth-icon').innerHTML = ICONS.lock;
    document.getElementById('ic-lock-old').innerHTML = ICONS.lock;
    document.getElementById('ic-lock-new').innerHTML = ICONS.lock;
    document.getElementById('ic-lock-new2').innerHTML = ICONS.lock;
    document.getElementById('password-toggle-old').innerHTML = ICONS.eye;
    document.getElementById('password-toggle-new').innerHTML = ICONS.eye;
    document.getElementById('password-toggle-new2').innerHTML = ICONS.eye;
  </script>
</body>
</html>
