<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Купить клиент — Inside Client</title>
<script>(function(){try{var t=localStorage.getItem('ic_theme')||'mono';document.documentElement.setAttribute('data-theme', t);if(t==='custom'){var raw=localStorage.getItem('ic_custom_palette');if(raw){var vars=JSON.parse(raw);for(var k in vars){document.documentElement.style.setProperty(k, vars[k]);}}}}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="buy">

  <div id="cursor-glow"></div>
  <header class="site-header" id="app-header"></header>

  <main>
    <div class="page-head reveal">
      <span class="eyebrow"><span class="dot"></span><span data-i18n="buy.eyebrow">Тарифы</span></span>
      <h1 data-i18n="buy.title">Купить клиент</h1>
      <p data-i18n="buy.text">Выбери срок — активация происходит сразу после оплаты.</p>
    </div>

    <div class="buy-layout">
      <section class="buy-col buy-col-main">
        <h2 class="buy-col-title" data-i18n="buy.title">Купить клиент</h2>
        <div class="plans" id="plans-grid-client"></div>
      </section>
      <div class="buy-divider" aria-hidden="true"></div>
      <section class="buy-col buy-col-side">
        <h2 class="buy-col-title" data-i18n="buy.otherTitle">Прочие предметы</h2>
        <div class="plans plans-side" id="plans-grid-other"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="app-footer"></footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/buy.js"></script>
</body>
</html>
